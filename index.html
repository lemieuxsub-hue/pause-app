<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pause</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pause">
<meta name="theme-color" content="#1F2A37">
<meta name="description" content="A pause button for texting one person.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  :root{
    --bg:#FBF8F3; --panel:#FFFFFF; --ink:#1F2A37; --muted:#6B7280; --line:#E6E1D8;
    --accent:#C8553D; --teal:#2F6F6A; --me:#1F2A37; --me-ink:#F3EEE6; --card:#F1ECE3;
    --ok:#2F6F6A; --warn:#C8553D; --chip:#E7F0EF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141A22; --panel:#1C242E; --ink:#F3EEE6; --muted:#9AA4B2; --line:#2A3542;
      --me:#F3EEE6; --me-ink:#1F2A37; --card:#232D39; --chip:#1F3634;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
  #app{display:flex;flex-direction:column;height:100%;height:100dvh}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
  header .with{color:var(--muted);font-size:14px}
  header .relsel{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 26px 4px 10px;font-family:inherit;font-size:14px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;max-width:50vw;text-overflow:ellipsis}
  header .spacer{flex:1}
  .dot{width:9px;height:9px;border-radius:50%;background:#B0B7C3}
  .dot.on{background:var(--ok)}
  .gear{background:none;border:0;color:var(--muted);font-size:20px;padding:4px 6px}
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 8px;display:flex;flex-direction:column;gap:10px}
  .day{align-self:center;color:var(--muted);font-size:12px;margin:8px 0 2px;text-transform:uppercase;letter-spacing:1px}
  .msg{max-width:92%;display:flex;flex-direction:column;gap:4px}
  .msg.me{align-self:flex-end;align-items:flex-end}
  .msg.them{align-self:flex-start}
  .bubble{padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
  .me .bubble{background:var(--me);color:var(--me-ink);border-bottom-right-radius:6px}
  .them .bubble{background:var(--chip);color:var(--ink);border-bottom-left-radius:6px}
  .meta{font-size:12px;color:var(--muted);padding:0 6px}
  .card{align-self:stretch;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px 10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card .title{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.3px;display:flex;justify-content:space-between;align-items:baseline}
  .card .title time{color:var(--muted);font-weight:500}
  .row{display:flex;gap:10px;margin-top:8px;align-items:flex-start}
  .row .k{flex:0 0 64px;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);padding-top:3px}
  .row .v{flex:1;white-space:pre-wrap}
  .row.stance .v{font-weight:600}
  .row.draft .v{background:var(--card);border-radius:10px;padding:8px 10px;font-style:italic}
  .row.draft .v .copy{display:block;font-style:normal;font-size:12px;color:var(--teal);margin-top:6px;background:none;border:0;padding:0;font-weight:600}
  .plain{white-space:pre-wrap;margin-top:6px}
  .acts{display:flex;gap:8px;margin-top:10px;align-items:center}
  .acts button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:15px}
  .acts button.sel{background:var(--chip);border-color:var(--teal)}
  .acts .reply{margin-left:auto;font-size:13px;color:var(--teal);font-weight:600;border-color:transparent}
  .thinking{align-self:flex-start;color:var(--muted);font-size:13px;padding:4px 8px}
  footer{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 12px calc(env(safe-area-inset-bottom) + 8px)}
  .modes{display:flex;gap:6px;margin-bottom:8px}
  .modes button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12px}
  .modes button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .compose{display:flex;gap:8px;align-items:flex-end}
  .attach{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:50%;width:42px;height:42px;font-size:20px;flex:0 0 42px;padding:0}
  .chipwrap:empty{display:none}
  .chipwrap{margin-bottom:8px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px;max-width:100%}
  .chip img{width:44px;height:44px;object-fit:cover;border-radius:8px}
  .chip span{font-size:13px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip button{border:0;background:none;color:var(--muted);font-size:16px;padding:2px 6px}
  .bubble img.att,.card img.att{display:block;max-width:100%;max-height:220px;border-radius:12px;margin-bottom:6px}
  textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:18px;padding:10px 14px;font-family:inherit;font-size:16px;line-height:1.35;max-height:140px;min-height:42px}
  .send{border:0;background:var(--accent);color:#fff;border-radius:50%;width:42px;height:42px;font-size:18px;flex:0 0 42px}
  .send:disabled{opacity:.4}
  .setup{padding:24px 20px;display:flex;flex-direction:column;gap:14px;max-width:420px;margin:auto}
  .setup h2{margin:0}
  .setup input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:16px}
  .setup button{padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-family:inherit;font-size:16px;font-weight:600}
  .setup p{color:var(--muted);margin:0}
  .hint{text-align:center;color:var(--muted);font-size:13px;padding:24px 12px}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:20}
  .sheet.open{display:flex}
  .sheet .inner{background:var(--panel);width:100%;border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:10px}
  .sheet code{font-size:13px;background:var(--card);padding:2px 6px;border-radius:6px}
  .sheet button{padding:10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-family:inherit;font-size:15px}
  .sheet textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:10px;font-family:inherit;font-size:14px;resize:vertical}
  .sheet .primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  #status:empty{display:none}
  .banner{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);padding:10px 16px;font-size:14px;line-height:1.35}
  #setup{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px 4px;max-height:48vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #setup:empty{display:none}
  .setup-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .setup-h h3{margin:0;font-size:15px}
  .setup-h span{color:var(--muted);font-size:13px}
  .step{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .step .st{width:22px;height:22px;border-radius:50%;flex:0 0 22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--chip);color:var(--teal);margin-top:1px}
  .step.done .st{background:var(--teal);color:#fff}
  .step .body{flex:1;min-width:0}
  .step h4{margin:0 0 2px;font-size:15px}
  .step p{margin:3px 0;color:var(--muted);font-size:14px;line-height:1.35}
  .step .ok{color:var(--teal);font-weight:600}
  .step .btn{display:inline-block;margin:6px 6px 0 0;border:1px solid var(--line);background:var(--panel);color:var(--teal);border-radius:999px;padding:5px 11px;font-size:13px;text-decoration:none;font-weight:600;font-family:inherit}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--card);padding:2px 6px;border-radius:6px;word-break:break-all}
  .setup-f{display:flex;justify-content:flex-end;gap:8px;padding:8px 0 6px;border-top:1px solid var(--line)}
  .setup-f button{border:0;background:none;color:var(--muted);font-size:13px;font-family:inherit;text-decoration:underline}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var LS = 'pause.cfg', RELS = 'pause.rels', ACTIVE = 'pause.active', RATE = 'pause.ratings';
  // One install, several people: `rels` is the list of relationships on this device, `cfg` the active one.
  var rels = loadRels(), cfg = pickActive(), app = document.getElementById('app');
  var seen = {}, ratings = loadJSON(RATE, {}), lastId = null, es = null, thinkingUntil = 0, messages = [];

  function loadJSON(k, d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } }
  function saveJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function parseHash(h){ var p = {}; (h || '').replace(/^#/, '').split('&').forEach(function(kv){ var i = kv.indexOf('='); if (i > 0) p[decodeURIComponent(kv.slice(0,i))] = decodeURIComponent(kv.slice(i+1)); }); return p; }
  function upsertRel(p){
    if (!p['in'] || !p['out']) return null;
    var i = -1; rels.forEach(function(r, k){ if (r.inTopic === p['in']) i = k; });
    var base = i >= 0 ? rels[i] : {};
    var rel = Object.assign({}, base, { server: p.server || base.server || 'https://ntfy.sh', inTopic: p['in'], outTopic: p['out'], name: p.name || base.name || 'them', mode: p.mode || base.mode || '', tok: p.tok || base.tok || '' });
    if (i >= 0) rels[i] = rel; else rels.push(rel);
    saveJSON(RELS, rels); try { localStorage.setItem(ACTIVE, rel.inTopic); } catch (e) {}
    return rel;
  }
  function loadRels(){
    var list = loadJSON(RELS, null);
    if (!list) { var old = loadJSON(LS, null); list = old && old.inTopic ? [old] : []; }
    rels = list;
    // keep the hash in the address: iOS copies the page URL when adding to the Home Screen, and the
    // installed app gets its own storage, so the codes must ride along in the link itself
    upsertRel(parseHash(location.hash));
    return rels;
  }
  function pickActive(){ var a = null; try { a = localStorage.getItem(ACTIVE); } catch (e) {} var hit = null; rels.forEach(function(r){ if (r.inTopic === a) hit = r; }); return hit || rels[0] || null; }
  function saveRels(){ saveJSON(RELS, rels); try { if (cfg) localStorage.setItem(ACTIVE, cfg.inTopic); } catch (e) {} }
  function switchRel(inTopic){
    var r = null; rels.forEach(function(x){ if (x.inTopic === inTopic) r = x; });
    if (!r || r === cfg) return;
    cfg = r; saveRels();
    if (es) { es.close(); es = null; }
    messages = []; seen = {}; lastId = null; thinkingUntil = 0; pendingFile = null;
    renderShell(); loadHistory(); swReady().then(resyncPush).catch(function(){});
  }
  window.addEventListener('hashchange', function(){ var r = upsertRel(parseHash(location.hash)); if (r) { if (r === cfg) renderShell(); switchRel(r.inTopic); } });
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function(ev){ var d = ev.data || {}; if (d.type === 'open' && d.url) { var i = d.url.indexOf('#'); if (i >= 0) { var r = upsertRel(parseHash(d.url.slice(i))); if (r) switchRel(r.inTopic); } } });

  // ---------- setup screen ----------
  function renderSetup(){
    app.innerHTML = '<div class="setup"><h2>Pause</h2><p>Enter the two channel codes from your welcome note. They stay on this phone.</p>'+
      '<input id="s-out" placeholder="Cards arrive on (e.g. pause-xxxx-1a2b3c4d)" autocapitalize="off" autocorrect="off">'+
      '<input id="s-in" placeholder="Pause listens on (e.g. pause-xxxx-in-5e6f7a8b)" autocapitalize="off" autocorrect="off">'+
      '<input id="s-name" placeholder="Their first name">'+
      '<button id="s-go">Open Pause</button></div>';
    document.getElementById('s-go').onclick = function(){
      var o = val('s-out'), i = val('s-in'), n = val('s-name') || 'them';
      if (!o || !i) return alert('Both codes are needed.');
      cfg = upsertRel({ 'in': i, 'out': o, name: n }); saveRels(); boot();
    };
  }
  function val(id){ return (document.getElementById(id).value || '').trim(); }

  // ---------- main screen ----------
  function renderShell(){
    app.innerHTML =
      '<header><h1>Pause</h1>'+headerWith()+'<span class="spacer"></span><span class="dot" id="dot"></span><button class="gear" id="bell" aria-label="Notifications">&#128277;</button><button class="gear" id="gear" aria-label="Settings">&#9881;</button></header>'+
      '<section id="status"></section><section id="setup"></section>'+
      '<main id="feed"><div class="hint">Loading the last few days…</div></main>'+
      '<footer><div class="modes" id="modes">'+
        '<button data-m="" class="sel">Auto</button><button data-m="ask: ">Ask</button><button data-m="draft: ">Check a draft</button><button data-m="teach: ">Teach</button><button data-quick="ask: What is my best next move with them right now? Reply, wait, or nothing, and if reply, what." style="margin-left:auto;border-color:var(--teal);color:var(--teal)">Best next move?</button>'+
      '</div><div class="chipwrap" id="chip"></div><div class="compose"><button class="attach" id="attach" aria-label="Attach an image">&#128206;</button><input type="file" id="file" accept="image/*" multiple hidden><textarea id="box" rows="1" placeholder="Ask, paste a draft, or tell Pause something"></textarea><button class="send" id="send" disabled aria-label="Send">&#8593;</button></div></footer>'+
      '<div class="sheet" id="sheet"><div class="inner"><strong>Pause with '+esc(cfg.name)+'</strong>'+
        '<div>Cards arrive on <code>'+esc(cfg.outTopic)+'</code></div><div>Pause listens on <code>'+esc(cfg.inTopic)+'</code></div>'+
        '<div style="color:var(--muted);font-size:13px">Keep the codes private: anyone who knew them could read your cards.</div>'+
        '<button id="showsetup">Show setup</button><button id="export">Export for my companion</button><button id="pasteprofile">Paste a profile from my companion</button>'+
        '<button id="addperson">Add another person</button>'+(rels.length > 1 ? '<button id="removeperson">Remove '+esc(cfg.name)+' from this device</button>' : '')+
        '<button id="reload">Reload history</button><button id="forget">Forget everyone on this device</button><button id="close">Close</button></div></div>'+
      '<div class="sheet" id="sheet2"><div class="inner"><strong id="s2-title"></strong><div id="s2-note" style="color:var(--muted);font-size:13px"></div><textarea id="s2-text"></textarea><button id="s2-go" class="primary"></button><button id="s2-close">Close</button></div></div>';
    var box = document.getElementById('box'), send = document.getElementById('send');
    box.addEventListener('input', function(){ box.style.height = 'auto'; box.style.height = Math.min(box.scrollHeight, 140) + 'px'; send.disabled = !box.value.trim() && !pendingFile; });
    send.onclick = function(){ submit(box.value); box.value = ''; box.style.height = 'auto'; send.disabled = true; };
    document.getElementById('attach').onclick = function(){ document.getElementById('file').click(); };
    document.getElementById('file').onchange = function(e){
      var fs = [].slice.call(e.target.files || []); e.target.value = ''; if (!fs.length) return;
      fs = fs.filter(function(f){ return /^image\//.test(f.type || ''); });
      if (!fs.length) { alert('Images only.'); return; }
      if (fs.some(function(f){ return f.size > 14 * 1024 * 1024; })) { alert('One of those is over 14 MB. Try screenshots or smaller photos.'); return; }
      if (fs.length > 20) { alert('Up to 20 images at a time.'); return; }
      pendingFile = fs.length === 1 ? fs[0] : fs; showChip(fs.length === 1 ? fs[0] : fs); send.disabled = false;
    };
    document.getElementById('modes').onclick = function(e){ var b = e.target.closest('button'); if (!b) return; if (b.hasAttribute('data-quick')) { thinkingUntil = Date.now() + 90000; post(b.getAttribute('data-quick')).then(function(m){ m.topic = cfg.inTopic; add(m, true); render(); setTimeout(render, 91000); }).catch(function(err){ thinkingUntil = 0; render(); alert('Could not send: ' + err.message); }); return; } [].forEach.call(this.children, function(x){ if (!x.hasAttribute('data-quick')) x.classList.remove('sel'); }); b.classList.add('sel'); };
    document.getElementById('gear').onclick = function(){ document.getElementById('sheet').classList.add('open'); };
    document.getElementById('bell').onclick = enablePush;
    updateBell();
    document.getElementById('close').onclick = function(){ document.getElementById('sheet').classList.remove('open'); };
    document.getElementById('reload').onclick = function(){ document.getElementById('sheet').classList.remove('open'); messages = []; seen = {}; lastId = null; loadHistory(); };
    document.getElementById('forget').onclick = function(){ if (confirm('Forget everyone on this device?')) { try { localStorage.removeItem(LS); localStorage.removeItem(RELS); localStorage.removeItem(ACTIVE); } catch (e) {} location.hash = ''; location.reload(); } };
    document.getElementById('showsetup').onclick = function(){ cfg.setupDone = false; saveRels(); document.getElementById('sheet').classList.remove('open'); renderSetup(); };
    document.getElementById('addperson').onclick = function(){ document.getElementById('sheet').classList.remove('open'); addPersonSheet(); };
    var rm = document.getElementById('removeperson');
    if (rm) rm.onclick = function(){ if (!confirm('Remove ' + cfg.name + ' from this device? Nothing on the server changes.')) return; rels = rels.filter(function(r){ return r !== cfg; }); cfg = rels[0]; saveRels(); document.getElementById('sheet').classList.remove('open'); if (es) { es.close(); es = null; } messages = []; seen = {}; lastId = null; renderShell(); loadHistory(); };
    var sel = document.getElementById('relsel');
    if (sel) sel.onchange = function(){ switchRel(this.value); };
    document.getElementById('export').onclick = function(){ document.getElementById('sheet').classList.remove('open'); openExport(); };
    document.getElementById('pasteprofile').onclick = function(){ document.getElementById('sheet').classList.remove('open'); openPasteProfile(); };
    document.getElementById('s2-close').onclick = function(){ document.getElementById('sheet2').classList.remove('open'); };
  }
  function mode(){ var s = document.querySelector('#modes .sel'); return s ? s.getAttribute('data-m') : ''; }

  // ---------- data ----------
  function topicsPath(){ return cfg.server + '/' + encodeURIComponent(cfg.outTopic) + ',' + encodeURIComponent(cfg.inTopic); }
  // private channels: an ntfy access token rides in the link (tok=); GET and SSE take it as ?auth=, POST/PUT as a header
  function authQ(rel){ rel = rel || cfg; if (!rel.tok) return ''; var b = btoa('Bearer ' + rel.tok).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); return 'auth=' + b; }
  function withAuth(url, rel){ var q = authQ(rel); return q ? url + (url.indexOf('?') >= 0 ? '&' : '?') + q : url; }
  function authHeaders(rel, h){ rel = rel || cfg; h = h || {}; if (rel.tok) h['Authorization'] = 'Bearer ' + rel.tok; return h; }
  // The relay only keeps about twelve hours, so each person's timeline is also kept on this device.
  function cacheKey(){ return 'pause.msgs.' + cfg.inTopic; }
  function slim(m){ var o = { id: m.id, time: m.time, topic: m.topic, title: m.title, message: m.message, tags: m.tags }; if (m.actions) o.actions = m.actions.map(function(a){ return { action: a.action, label: a.label, url: a.url, body: a.body }; }); if (m.attachment) o.attachment = { url: m.attachment.url, name: m.attachment.name, type: m.attachment.type, expires: m.attachment.expires }; return o; }
  var saveTimer = null;
  function saveCache(){ clearTimeout(saveTimer); saveTimer = setTimeout(function(){ try { var keep = messages.slice().sort(function(a,b){ return a.time - b.time; }).slice(-400).map(slim); localStorage.setItem(cacheKey(), JSON.stringify(keep)); } catch (e) {} }, 800); }
  function loadCache(){ var list = loadJSON(cacheKey(), []); list.forEach(function(m){ if (!m || !m.id || seen[m.id]) return; if (isHeartbeat(m)) { seen[m.id] = 1; if (m.time > lastHb) lastHb = m.time; return; } seen[m.id] = 1; messages.push(m); }); }
  function loadHistory(){
    loadCache();
    fetch(withAuth(topicsPath() + '/json?poll=1&since=72h')).then(function(r){ return r.text(); }).then(function(t){
      t.split('\n').forEach(function(line){ if (!line.trim()) return; try{ var m = JSON.parse(line); if (m.event === 'message') add(m, false); }catch(e){} });
      render(); connect(); saveCache();
    }).catch(function(){ if (messages.length) { render(); connect(); } else document.getElementById('feed').innerHTML = '<div class="hint">Could not reach the relay. Check your connection and pull to retry.</div>'; });
  }
  function connect(){
    if (es) { es.close(); es = null; }
    var url = withAuth(topicsPath() + '/sse' + (lastId ? '?since=' + encodeURIComponent(lastId) : '?since=10s'));
    es = new EventSource(url);
    es.onopen = function(){ setDot(true); };
    es.onerror = function(){ setDot(false); };
    es.onmessage = function(ev){ try{ var m = JSON.parse(ev.data); if (m.event === 'message') { if (add(m, true)) render(); } }catch(e){} };
  }
  function setDot(on){ var d = document.getElementById('dot'); if (d) d.className = 'dot' + (on ? ' on' : ''); }
  function renderStatus(){
    var el = document.getElementById('status'); if (!el) return;
    if (!lastHb) { try { lastHb = Number(localStorage.getItem('pause.hb.' + cfg.inTopic)) || 0; } catch (e) {} }
    var age = lastHb ? (Date.now() / 1000 - lastHb) : null;
    if (age === null) { el.innerHTML = ''; return; }
    if (age < 330) { el.innerHTML = ''; return; }
    var since = new Date(lastHb * 1000), today = since.toDateString() === new Date().toDateString();
    var when = since.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + (today ? '' : ' on ' + since.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }));
    el.innerHTML = '<div class="banner">Pause’s server hasn’t checked in since ' + esc(when) + '. It is probably asleep. Cards and answers resume when it is back; anything you send now waits for it.</div>';
  }
  setInterval(renderStatus, 60000);
  var lastHb = 0;  // the server's latest heartbeat, so the app can say when the Mac is asleep
  function isHeartbeat(m){ return (m.tags || []).indexOf('heartbeat') >= 0 || (m.title === 'Pause heartbeat') || ((m.message || '').trim() === 'hb' && !m.attachment); }
  function add(m, live){
    if (seen[m.id]) return false;
    if (isHeartbeat(m)) { seen[m.id] = 1; if (m.time > lastHb) { lastHb = m.time; try { localStorage.setItem('pause.hb.' + cfg.inTopic, String(lastHb)); } catch (e) {} } lastId = m.id; renderStatus(); return false; }
    seen[m.id] = 1; messages.push(m); lastId = m.id;
    if (m.topic === cfg.inTopic) { var r = /^\s*rate:\s*([0-9a-z]+)\s+(up|down)/i.exec(m.message || ''); if (r) { ratings[r[1]] = r[2].toLowerCase(); saveJSON(RATE, ratings); } }
    if (m.topic === cfg.outTopic && m.time * 1000 >= thinkingUntil - 90000) thinkingUntil = 0;
    if (live) saveCache();
    return true;
  }

  // ---------- render ----------
  function render(){
    var feed = document.getElementById('feed'); if (!feed) return;
    var atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
    messages.sort(function(a,b){ return a.time - b.time; });
    var html = '', lastDay = '';
    messages.forEach(function(m){
      var d = dayLabel(m.time); if (d !== lastDay) { html += '<div class="day">'+d+'</div>'; lastDay = d; }
      html += m.topic === cfg.inTopic ? renderMine(m) : renderCard(m);
    });
    if (!messages.length) html = '<div class="hint">Nothing yet. Cards arrive here about a minute after '+esc(cfg.name)+' texts. Ask something below to start.</div>';
    if (thinkingUntil > Date.now()) html += '<div class="thinking">Pause is thinking…</div>';
    feed.innerHTML = html;
    if (atBottom || true) feed.scrollTop = feed.scrollHeight;
    renderSetup(); renderStatus();
  }

  // ---------- setup panel: detects its own progress ----------
  var APP_BASE = 'https://lemieuxsub-hue.github.io/pause-app/';
  function isStandalone(){ try { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; } catch (e) { return false; } }
  function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent); }
  function isMacSafari(){ var u = navigator.userAgent; return /Macintosh/.test(u) && /Safari/.test(u) && !/Chrome|Chromium|Edg/.test(u); }
  function lastIncoming(){ var last = null; messages.forEach(function(m){ if (m.topic === cfg.inTopic && /^\s*in:\s*\S/.test(m.message || '')) last = m; }); return last; }
  function interviewDone(){ if (cfg.profileSent) return true; return messages.some(function(m){ return m.topic === cfg.outTopic && (/Pause is ready/i.test(m.title || '') || /^Profile saved/i.test(m.message || '')); }); }
  function renderSetup(){
    var el = document.getElementById('setup'); if (!el) return;
    if (cfg.setupDone) { el.innerHTML = ''; return; }
    var mac = cfg.mode === 'mac';
    var steps = [];
    var installed = isStandalone();
    var installHow = isIOS() ? 'Tap the Share button in Safari, then <b>Add to Home Screen</b>, then open Pause from the new icon.' : isMacSafari() ? 'In Safari: <b>File → Add to Dock</b>. Then open Pause from the Dock.' : 'In Chrome: click the install icon at the right of the address bar, or <b>⋮ → Cast, save and share → Install page as app</b>.';
    steps.push({ done: installed, title: 'Install Pause on this device', body: installed ? '<p class="ok">Installed.</p>' : '<p>' + installHow + '</p><p>Until then it works here too, just without notifications.</p>' });
    var notif = pushOn();
    var canPush = ('PushManager' in window);
    steps.push({ done: notif, title: 'Turn on notifications', body: notif ? '<p class="ok">On for this device.</p>' : (!canPush && isIOS() ? '<p>Finish step 1 first: iPhone only allows notifications for an installed app.</p>' : '<p>Cards, answers and nudges arrive as Pause notifications.</p><button class="btn" data-act="push">Turn on</button>') });
    if (!mac) {
      var inc = lastIncoming();
      steps.push({ done: !!inc, title: 'Let Pause see ' + esc(cfg.name) + '’s texts', body:
        (inc ? '<p class="ok">Working. Last forwarded ' + tm(inc.time) + '.</p>' : '') +
        '<p>Your code: <span class="code">' + esc(cfg.inTopic) + '</span> <button class="btn" data-copy="' + esc(cfg.inTopic) + '">Copy</button></p>' +
        '<p>1. Add the forwarding shortcut. It asks for your code when you add it; paste it in.</p>' +
        '<a class="btn" href="shortcuts://import-shortcut/?url=' + encodeURIComponent(APP_BASE + 'pause-in.shortcut') + '&name=' + encodeURIComponent('Pause In') + '">Add the forwarding shortcut</a>' +
        '<p>2. In Shortcuts, tap <b>Pause In</b> once and choose <b>Always Allow</b>. (Skipping this makes it fail silently later.)</p>' +
        '<p>3. Shortcuts → <b>Automation</b> → <b>+</b> → <b>Message</b> → Sender: ' + esc(cfg.name) + ' → <b>Run Immediately</b>, Notify When Run off → Next → <b>Pause In</b> → Done.</p>' +
        (inc ? '' : '<p>This step marks itself done when the first text comes through.</p>') +
        '<button class="btn" data-act="macmode">My Mac forwards the texts instead</button>' });
      var iv = interviewDone();
      steps.push({ done: iv, title: 'Teach Pause about the two of you', body: iv ? '<p class="ok">Done. Teach it more any time by just telling it.</p>' : '<p>Twelve short questions, one at a time, in this thread. Or paste a profile your companion AI wrote for you.</p><button class="btn" data-act="start">Start the interview</button><button class="btn" data-act="paste">Paste a profile</button>' });
    }
    var doneCount = steps.filter(function(s){ return s.done; }).length;
    var html = '<div class="setup-h"><h3>Setup</h3><span>' + doneCount + ' of ' + steps.length + ' done</span></div>';
    steps.forEach(function(s, i){ html += '<div class="step' + (s.done ? ' done' : '') + '"><div class="st">' + (s.done ? '✓' : (i + 1)) + '</div><div class="body"><h4>' + s.title + '</h4>' + s.body + '</div></div>'; });
    html += '<div class="setup-f"><button data-act="hidesetup">' + (doneCount === steps.length ? 'All set, hide this' : 'Hide setup for now') + '</button></div>';
    el.innerHTML = html;
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'push') enablePush();
    else if (act === 'start') { post('start').then(function(m){ seen[m.id] = 1; thinkingUntil = Date.now() + 60000; render(); }).catch(function(err){ alert('Could not send: ' + err.message); }); }
    else if (act === 'paste') openPasteProfile();
    else if (act === 'macmode') { cfg.mode = 'mac'; saveRels(); renderSetup(); }
    else if (act === 'hidesetup') { cfg.setupDone = true; saveRels(); renderSetup(); }
  });
  function sheet2(title, note, text, button, onGo){
    document.getElementById('s2-title').textContent = title; document.getElementById('s2-note').textContent = note;
    var ta = document.getElementById('s2-text'); ta.value = text || ''; ta.readOnly = !!text;
    var go = document.getElementById('s2-go'); go.textContent = button; go.onclick = function(){ onGo(ta.value); };
    document.getElementById('sheet2').classList.add('open');
  }
  function exportText(){
    var since = Date.now() / 1000 - 7 * 86400, out = ['Pause export for ' + (cfg.name) + ', last 7 days. Generated ' + new Date().toLocaleString() + '.', ''];
    messages.filter(function(m){ return m.time >= since; }).forEach(function(m){
      var t = m.message || ''; if (/^\s*(rate|subscribe|profile):/i.test(t)) return;
      var when = new Date(m.time * 1000).toLocaleString([], { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      if (m.topic === cfg.inTopic) out.push(when + '  ME to Pause: ' + t.replace(/\s+/g, ' ')); else out.push(when + '  ' + (m.title || 'Pause') + '\n' + t.split('\n').map(function(l){ return '    ' + l; }).join('\n'));
      out.push('');
    });
    return out.join('\n');
  }
  function openExport(){
    var text = exportText();
    sheet2('Export for my companion', 'Copy this and paste it into your companion conversation. Pause also sends its own export card with your profile and lessons.', text, 'Copy', function(){ copy(text); document.getElementById('s2-go').textContent = 'Copied'; });
    post('export').then(function(m){ seen[m.id] = 1; }).catch(function(){});
  }
  function openPasteProfile(){
    sheet2('Paste a profile from my companion', 'Ask your companion AI to write the profile described in the Pause Companion guide, then paste it here. It replaces what Pause knows about the two of you; your lessons stay.', '', 'Send to Pause', function(v){
      v = (v || '').trim(); if (v.length < 200) return alert('That looks too short for a profile. Paste the whole thing.');
      post('profile: ' + v).then(function(m){ seen[m.id] = 1; cfg.profileSent = true; saveRels(); document.getElementById('sheet2').classList.remove('open'); thinkingUntil = Date.now() + 30000; render(); }).catch(function(err){ alert('Could not send: ' + err.message); });
    });
  }
  function renderMine(m){
    var t = m.message || '';
    if (/^\s*(rate|subscribe):/i.test(t)) return '';
    if (/^\s*profile:/i.test(t)) return '<div class="msg me"><div class="bubble">Shared a profile with Pause</div><div class="meta">' + tm(m.time) + '</div></div>';
    var label = '', body = t, pre = /^\s*(ask|draft|teach|note|remember|sent|in):\s*/i.exec(t);
    if (pre) { label = pre[1].toLowerCase(); body = t.slice(pre[0].length); }
    if (label === 'in') return '<div class="msg them"><div class="bubble">'+esc(body)+'</div><div class="meta">'+esc(cfg.name)+' · '+tm(m.time)+'</div></div>';
    var tag = { ask:'question', draft:'draft check', teach:'teaching Pause', note:'note', remember:'teaching Pause', sent:'what you sent' }[label] || '';
    var img = attImg(m);
    if (img && /^You received a file/i.test(body)) body = '';
    return '<div class="msg me"><div class="bubble">'+img+esc(body)+'</div><div class="meta">'+(tag ? tag + ' · ' : '')+tm(m.time)+'</div></div>';
  }
  function attImg(m){
    var a = m.attachment; if (!a || !a.url || !/^image\//.test(a.type || '')) return '';
    if (a.expires && a.expires * 1000 < Date.now()) return '<div class="meta" style="padding:0 0 4px">image expired</div>';
    return '<img class="att" src="' + esc(withAuth(a.url)) + '" alt="' + esc(a.name || 'image') + '">';
  }
  function renderCard(m){
    var title = m.title || 'Pause', body = m.message || '', lines = body.split('\n'), rows = '';
    var cid = cardId(m), rated = cid ? ratings[cid] : null;
    lines.forEach(function(ln){
      var mm = /^(READ|STANCE|DRAFT ES|DRAFT|DON[’']T|REACH|TODAY|VERDICT|WHY|BETTER|LEARNED|OPENED|COUNT|HER BRICKS|YOUR TELLS|LOG)\s+(.*)$/.exec(ln);
      if (mm) {
        var k = mm[1], v = mm[2], cls = k === 'STANCE' || k === 'VERDICT' ? 'stance' : (k === 'DRAFT' || k === 'BETTER' || k === 'DRAFT ES') ? 'draft' : '';
        if (cls === 'draft') { var q = v.replace(/^[“"]|[”"]$/g, ''); rows += '<div class="row draft"><div class="k">'+k+'</div><div class="v">'+esc(q)+'<button class="copy" data-copy="'+esc(q)+'">Copy</button></div></div>'; }
        else rows += '<div class="row '+cls+'"><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div></div>';
      } else if (ln.trim()) rows += '<div class="plain">'+esc(ln)+'</div>';
    });
    var acts = '';
    if (cid) acts = '<div class="acts"><button data-rate="up" data-cid="'+cid+'" class="'+(rated==='up'?'sel':'')+'">&#128077;</button><button data-rate="down" data-cid="'+cid+'" class="'+(rated==='down'?'sel':'')+'">&#128078;</button><button class="reply" data-reply="1">Reply</button></div>';
    return '<div class="card"><div class="title"><span>'+esc(title)+'</span><time>'+tm(m.time)+'</time></div>'+attImg(m)+rows+acts+'</div>';
  }
  function cardId(m){
    if (!m.actions) return null;
    for (var i = 0; i < m.actions.length; i++) { var a = m.actions[i]; if (a.action === 'http' && a.body) { var r = /rate:\s*([0-9a-z]+)/i.exec(a.body); if (r) return r[1]; } }
    return null;
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-rate')) { rate(b.getAttribute('data-cid'), b.getAttribute('data-rate')); }
    else if (b.hasAttribute('data-copy')) { copy(b.getAttribute('data-copy')); b.textContent = 'Copied'; setTimeout(function(){ b.textContent = 'Copy'; }, 1500); }
    else if (b.hasAttribute('data-reply')) { var box = document.getElementById('box'); box.focus(); }
  });

  // ---------- actions ----------
  function postTo(rel, message){
    return fetch(rel.server, { method:'POST', headers: authHeaders(rel, {'Content-Type':'application/json'}), body: JSON.stringify({ topic: rel.inTopic, message: message }) })
      .then(function(r){ if (!r.ok) throw new Error('relay ' + r.status); return r.json(); });
  }
  function post(message){ return postTo(cfg, message); }
  function postAll(message){ return Promise.all(rels.map(function(r){ return postTo(r, message).catch(function(){ return null; }); })); }
  function headerWith(){
    if (rels.length < 2) return '<span class="with">with '+esc(cfg.name)+'</span>';
    var o = rels.map(function(r){ return '<option value="'+esc(r.inTopic)+'"'+(r === cfg ? ' selected' : '')+'>with '+esc(r.name)+'</option>'; }).join('');
    return '<select class="relsel" id="relsel" aria-label="Choose a person">'+o+'</select>';
  }
  function addPersonSheet(){
    sheet2('Add another person', 'Paste that person’s Pause link (from the Mac: python3 pause.py --list-rels), or their two codes as in=…&out=…&name=…. Each person has their own memory; nothing crosses over.', '', 'Add', function(v){
      v = (v || '').trim(); var i = v.indexOf('#'); var p = parseHash(i >= 0 ? v.slice(i) : v);
      if (!p['in'] || !p['out']) return alert('That does not look like a Pause link. It needs in= and out= codes.');
      var r = upsertRel(p); document.getElementById('sheet2').classList.remove('open'); switchRel(r.inTopic); if (r === cfg) { renderShell(); loadHistory(); }
    });
  }
  var pendingFile = null;
  function showChip(f){
    var c = document.getElementById('chip'); if (!c) return;
    if (!f) { c.innerHTML = ''; return; }
    var first = Array.isArray(f) ? f[0] : f, label = Array.isArray(f) ? (f.length + ' images (sent one by one)') : (f.name || 'image');
    var url = URL.createObjectURL(first);
    c.innerHTML = '<div class="chip"><img src="' + url + '" alt=""><span>' + esc(label) + '</span><button id="chipx" aria-label="Remove image">&#10005;</button></div>';
    document.getElementById('chipx').onclick = function(){ pendingFile = null; showChip(null); var b = document.getElementById('box'); document.getElementById('send').disabled = !b.value.trim(); };
  }
  function rfc2047(s){ return /^[\x20-\x7e]*$/.test(s) ? s : '=?UTF-8?B?' + btoa(unescape(encodeURIComponent(s))) + '?='; }
  function postFile(file, message){
    var h = authHeaders(cfg, { 'X-Filename': rfc2047(file.name || 'image.jpg') });
    if (message) h['X-Message'] = rfc2047(message);
    return fetch(cfg.server + '/' + encodeURIComponent(cfg.inTopic), { method:'PUT', headers: h, body: file })
      .then(function(r){ if (!r.ok) throw new Error('relay ' + r.status); return r.json(); });
  }
  function submit(text){
    text = (text || '').trim(); if (!text && !pendingFile) return;
    var msg = text ? mode() + text : '';
    var f = pendingFile; pendingFile = null; showChip(null);
    thinkingUntil = Date.now() + 90000;
    var job;
    if (Array.isArray(f)) {
      // several images: send one at a time, each with the same text, a few seconds apart for the relay
      job = f.reduce(function(p, file, i){ return p.then(function(){ return new Promise(function(res){ setTimeout(res, i ? 4000 : 0); }).then(function(){ return postFile(file, msg); }).then(function(m){ m.topic = cfg.inTopic; add(m, true); render(); }); }); }, Promise.resolve()).then(function(){ return { id: 'batch' }; });
    } else job = (f ? postFile(f, msg) : post(msg));
    job.then(function(m){ if (m && m.id && m.id !== 'batch') { m.topic = cfg.inTopic; add(m, true); } render(); setTimeout(render, 91000); })
      .catch(function(err){ thinkingUntil = 0; render(); alert('Could not send: ' + err.message); });
  }
  function rate(cid, v){
    ratings[cid] = v; saveJSON(RATE, ratings); render();
    post('rate: ' + cid + ' ' + v).then(function(m){ m.topic = cfg.inTopic; seen[m.id] = 1; }).catch(function(){});
  }
  function copy(t){ if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t); else { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); } }

  // ---------- notifications from Pause itself (Web Push) ----------
  var VAPID = 'BHuK34YTDNOTbftwMChqhchTJkfgpoq-p-wKR2HxDY4gpqPzP6BtMytHeKKR2EAPHIdp48i9iLc9SlNrAaKCoAw';
  var PUSHED = 'pause.pushed';
  function b64ToU8(s){ var pad = '='.repeat((4 - s.length % 4) % 4); var raw = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/')); var u = new Uint8Array(raw.length); for (var i = 0; i < raw.length; i++) u[i] = raw.charCodeAt(i); return u; }
  function swReady(){ if (!('serviceWorker' in navigator)) return Promise.reject(new Error('no service worker')); return navigator.serviceWorker.register('sw.js').then(function(){ return navigator.serviceWorker.ready; }); }
  function pushOn(){ try { return ('Notification' in window) && Notification.permission === 'granted' && !!localStorage.getItem(PUSHED); } catch (e) { return false; } }
  function updateBell(){ var b = document.getElementById('bell'); if (!b) return; if (!('Notification' in window)) { b.style.display = 'none'; return; } var on = pushOn(); b.innerHTML = on ? '&#128276;' : '&#128277;'; b.style.opacity = on ? '.55' : '1'; b.title = on ? 'Notifications are on' : 'Turn on notifications'; if (typeof renderSetup === 'function') renderSetup(); }
  function enablePush(){
    if (!('Notification' in window) || !('serviceWorker' in navigator)) return alert('This browser cannot show notifications.');
    if (!('PushManager' in window)) return alert('On iPhone, add Pause to your Home Screen first (Share, then Add to Home Screen), open it from there, and tap the bell inside it.');
    if (pushOn()) { if (confirm('Notifications are on for this device. Send a test?')) post('ask: say hi, this is a notification test').then(function(m){ seen[m.id] = 1; }); return; }
    Notification.requestPermission().then(function(perm){
      if (perm !== 'granted') { alert('Notifications were not allowed. You can change that in Settings.'); return; }
      return swReady().then(function(reg){
        return reg.pushManager.getSubscription().then(function(s){ return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID) }); });
      }).then(function(sub){
        return postAll('subscribe: ' + JSON.stringify(sub.toJSON())).then(function(ms){ ms.forEach(function(m){ if (m && m.id) seen[m.id] = 1; }); try { localStorage.setItem(PUSHED, sub.endpoint); } catch (e) {} updateBell(); });
      });
    }).catch(function(err){ alert('Could not turn on notifications: ' + err.message); });
  }
  function resyncPush(){
    if (!('PushManager' in window) || !('Notification' in window) || Notification.permission !== 'granted') return;
    swReady().then(function(reg){ return reg.pushManager.getSubscription(); }).then(function(sub){
      var had = null; try { had = localStorage.getItem(PUSHED); } catch (e) {}
      if (sub && had !== sub.endpoint) return postAll('subscribe: ' + JSON.stringify(sub.toJSON())).then(function(ms){ ms.forEach(function(m){ if (m && m.id) seen[m.id] = 1; }); try { localStorage.setItem(PUSHED, sub.endpoint); } catch (e) {} updateBell(); });
    }).catch(function(){});
  }

  // ---------- utils ----------
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function tm(t){ var d = new Date(t * 1000); return d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }); }
  function dayLabel(t){ var d = new Date(t * 1000), n = new Date(); var same = function(a,b){ return a.toDateString() === b.toDateString(); };
    if (same(d, n)) return 'Today'; var y = new Date(n); y.setDate(n.getDate() - 1); if (same(d, y)) return 'Yesterday';
    return d.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' }); }

  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && cfg) { fetch(withAuth(topicsPath() + '/json?poll=1&since=' + encodeURIComponent(lastId || '1h'))).then(function(r){ return r.text(); }).then(function(t){ var n = false; t.split('\n').forEach(function(line){ if (!line.trim()) return; try{ var m = JSON.parse(line); if (m.event === 'message' && add(m, true)) n = true; }catch(e){} }); if (n) render(); connect(); }).catch(function(){ connect(); }); } });

  function boot(){ if (!cfg) return renderSetup(); renderShell(); loadHistory(); swReady().then(resyncPush).catch(function(){}); }
  boot();
})();
</script>
</body>
